[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/joyshell-agent",
  "crates/joyshell-core",
  "crates/joyshell-store"
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
aes-gcm = "0.10"
sha2 = "0.10"
ssh2 = { version = "0.9", features = ["openssl-on-win32", "vendored-openssl"] }
mio = { version = "1", features = ["net", "os-poll"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
