[package]
name = "joyshell-desktop"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "joyshell_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64 = "0.22"
ssh2.workspace = true
arboard = "3.6"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
uuid.workspace = true
joyshell-agent = { path = "../../../crates/joyshell-agent" }
joyshell-core = { path = "../../../crates/joyshell-core" }
joyshell-store = { path = "../../../crates/joyshell-store" }
